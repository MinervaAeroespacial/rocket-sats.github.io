<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="description" content="Foguetes e satélites da Minerva Rockets e da Minerva Sats, organizados por ano.">
<meta property="og:title" content="Projetos — Minerva Aeroespacial">
<meta property="og:description" content="Foguetes e satélites da Minerva Rockets e da Minerva Sats, organizados por ano.">
<meta property="og:image" content="img/fotos/equipe-2026.webp">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="img/logos/minerva-aeroespacial.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body data-page="projetos">
<header id="header"></header>
<main>

<section class="hero short">
  <div class="bg" style="background-image:url('img/fotos/caronte-lasc-2023.webp');background-position:center 70%"></div>
  <div class="container">
    <span class="eyebrow">Projetos</span>
    <h1>Foguetes e satélites<br>ao longo dos anos</h1>
    <p class="lead">Do Aurora ao Hemera, do SensoSat ao CariocaSat. Escolha um projeto, gire o modelo e filtre por ano ou por equipe.</p>
  </div>
</section>
<section class="sec">
  <div class="container">
    <div class="filter-row"><div><label>Ano</label></div><div class="chips" id="anos"></div></div>
    <div class="filter-row"><div><label>Equipe</label></div><div class="chips" id="times"></div></div>
    <div class="sel-stage" id="sel-stage"></div>
    <div class="roster" id="roster" aria-label="Escolha um projeto"></div>
  </div>
</section>
<section class="sec alt">
  <div class="container split" style="align-items:start">
    <div><span class="eyebrow">Linha do tempo</span><h2>Conquistas</h2><p class="mut">Os resultados acompanham os mesmos filtros de ano e equipe.</p></div>
    <div id="conquistas"></div>
  </div>
</section>

</main>
<footer id="footer"></footer>
<script src="dados.js"></script>
<script src="app.js"></script>
